<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>NEON RUSH - STREET LEGENDS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a14;color:#eaf6ff;font-family:sans-serif;overflow:hidden;height:100vh;touch-action:none}
.screen{display:none;position:fixed;inset:0;align-items:center;justify-content:center}
.screen.active{display:flex}
.menu-panel{background:rgba(18,18,31,0.95);border:1px solid rgba(46,242,255,0.25);border-radius:14px;padding:30px 24px;width:min(520px,92vw);max-height:92vh;overflow-y:auto}
h1{text-align:center;font-size:2.4rem;color:#2ef2ff;text-shadow:0 0 20px #2ef2ff}
h1 small{display:block;font-size:0.9rem;color:#ff2e88;text-shadow:0 0 10px #ff2e88}
h2{text-align:center;color:#ffe62e;margin-bottom:18px}
.menu-btn{display:block;width:100%;padding:14px;margin:8px 0;background:rgba(46,242,255,0.06);border:1px solid rgba(46,242,255,0.3);border-radius:8px;color:#eaf6ff;font-size:1rem;font-weight:700;cursor:pointer;transition:all 0.2s}
.menu-btn:hover{background:rgba(46,242,255,0.18);transform:translateY(-2px)}
.menu-btn.primary{border-color:#ff2e88;background:rgba(255,46,136,0.12)}
.menu-btn.primary:hover{background:rgba(255,46,136,0.25)}
.setup-row{margin-bottom:12px}
.setup-row label{font-size:0.75rem;color:#7a8199;display:block;margin-bottom:4px}
.setup-select{display:flex;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 10px;align-items:center}
.setup-value{flex:1;text-align:center;font-weight:700;font-size:1.05rem}
.arrow-btn{background:transparent;color:#2ef2ff;border:none;font-size:1.2rem;padding:0 12px;cursor:pointer;transition:all 0.2s}
.arrow-btn:hover{color:#ff2e88;transform:scale(1.2)}
.vehicle-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-top:8px;font-size:0.7rem;color:#7a8199}
.vehicle-stats .stat{display:flex;align-items:center;gap:6px}
.vehicle-stats .bar{flex:1;height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden}
.vehicle-stats .fill{height:100%;background:#2ef2ff;border-radius:2px}
.setup-actions{display:flex;gap:10px;margin-top:16px}
.setup-actions .menu-btn{flex:1}
.records-list{max-height:50vh;overflow-y:auto}
.record-row{display:flex;justify-content:space-between;padding:10px 12px;background:rgba(255,255,255,0.03);border-radius:6px;margin-bottom:4px;font-size:0.85rem}
.version{text-align:center;color:#7a8199;font-size:0.7rem;margin-top:12px}
.hud{position:fixed;inset:0;pointer-events:none;z-index:20;font-weight:700}
.hud-top-left{position:absolute;top:14px;left:14px}
.hud-position{font-size:1.8rem;color:#ffe62e;text-shadow:0 0 10px rgba(255,230,46,0.6)}
.hud-lap{font-size:0.85rem;color:#eaf6ff;opacity:0.85}
.hud-wrongway{font-size:0.9rem;color:#ff2e88;text-shadow:0 0 8px #ff2e88;margin-top:4px;opacity:0;transition:opacity 0.15s}
.hud-wrongway.show{opacity:1}
.hud-top-right{position:absolute;top:14px;right:14px}
.hud-time{font-size:1.3rem;color:#2ef2ff;text-shadow:0 0 8px rgba(46,242,255,0.6);font-variant-numeric:tabular-nums}
.hud-bottom-left{position:absolute;bottom:14px;left:14px}
#minimap{background:rgba(5,5,12,0.55);border:1px solid rgba(46,242,255,0.35);border-radius:8px}
.hud-bottom-right{position:absolute;bottom:14px;right:14px;width:160px}
.hud-speed{font-size:1.6rem;text-align:right}
.hud-speed small{font-size:0.7rem;color:#7a8199;margin-left:4px}
.hud-bar-wrap{width:100%;margin-top:4px}
.hud-label{font-size:0.55rem;color:#7a8199;text-align:right;text-transform:uppercase;letter-spacing:1px}
.hud-bar{width:100%;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
.hud-bar-fill{height:100%;width:0%;border-radius:3px;transition:width 0.08s}
.hud-bar-fill.nitro{background:linear-gradient(90deg,#a63bff,#2ef2ff)}
.hud-bar-fill.damage{background:linear-gradient(90deg,#ffcc33,#ff4444)}
.overlay{position:fixed;inset:0;background:rgba(5,5,10,0.85);display:flex;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(8px)}
#countdown-number{font-size:20vw;font-weight:900;color:#2ef2ff;text-shadow:0 0 30px #2ef2ff,0 0 60px rgba(46,242,255,0.3)}
.hidden{display:none!important}
#game-canvas{display:block;width:100%;height:100%;background:#06060c}
.pause-btn{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:25;background:rgba(0,0,0,0.5);color:#eaf6ff;border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:6px 16px;cursor:pointer;pointer-events:auto;backdrop-filter:blur(4px);transition:all 0.2s}
.pause-btn:hover{background:rgba(46,242,255,0.15);border-color:#2ef2ff}
.touch-controls{position:fixed;inset:0;z-index:22;display:flex;justify-content:space-between;align-items:flex-end;padding:12px;pointer-events:none}
.touch-left,.touch-right{display:flex;gap:8px;pointer-events:auto;align-items:flex-end}
.touch-right{flex-wrap:wrap;max-width:200px;justify-content:flex-end}
.touch-btn{width:60px;height:60px;border-radius:50%;background:rgba(46,242,255,0.12);border:2px solid rgba(46,242,255,0.35);color:#eaf6ff;font-size:1.3rem;user-select:none;touch-action:none;transition:all 0.1s;backdrop-filter:blur(4px)}
.touch-btn:active{background:rgba(46,242,255,0.3);transform:scale(0.92);border-color:#2ef2ff}
.touch-btn.small{width:50px;height:50px;font-size:0.7rem;background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.2)}
.touch-btn.accel{background:rgba(46,242,255,0.2);border-color:#2ef2ff;font-size:1.5rem}
.touch-btn.nitro{background:rgba(166,59,255,0.2);border-color:#a63bff;font-size:0.7rem;font-weight:900}
.touch-btn.nitro:active{background:rgba(166,59,255,0.4)}
@media(min-width:900px){.touch-controls{display:none!important}}
@media(max-width:500px){.touch-btn{width:50px;height:50px;font-size:1rem}.touch-btn.small{width:42px;height:42px}.touch-right{max-width:160px}}
</style>

<body>

<script>
// ============================================================
// NEON RUSH - STREET LEGENDS - RECONSTRUIDO DESDE CERO (v3.0)
//
// Cambios respecto a la versión anterior:
// 1. Persistencia migrada de localStorage (no soportado aquí) a
//    window.storage con fallback en memoria si no existe.
// 2. Bug de vuelta: se eliminó la validación "checkpointsPassed"
//    que nunca podía fallar (código muerto). La vuelta ahora se
//    cuenta simplemente cuando nextCheckpoint vuelve a 0.
// 3. "wrongWay" ahora se USA de verdad: penaliza velocidad y se
//    muestra un aviso en el HUD, en vez de ser una bandera muerta.
// 4. Las 3 pistas se reconstruyeron para que sean curvas cerradas
//    SIN auto-intersección (la pista "Desierto" anterior era una
//    lemniscata en forma de 8 que confundía el sistema de
//    checkpoints al cruzarse consigo misma).
// 5. El motor de audio se detiene explícitamente antes de volver
//    a arrancar (reinicio/pausa ya no deja osciladores huérfanos).
// 6. El minimapa precalcula sus límites y escala UNA vez al
//    construir la pista, en vez de recorrer todos los puntos cada
//    frame.
// ============================================================

// ---------- TUS CORREDORES ----------
const TUS_CORREDORES = [
  'MARVIN PICHON',
  'NELLY PICHA DE GATO',
  'TIO LA FLECHA',
  'AROD COPEG',
  'JOHASN'
];

// ---------- DATOS DE VEHICULOS ----------
const VEHICLES = [
  {id:'vortex',name:'Vortex R7',color:'#2ef2ff',stats:{topSpeed:78,acceleration:55,braking:60,grip:55,handling:60,weight:50,power:70,nitro:60,driftAbility:55}},
  {id:'phantom',name:'Phantom GT',color:'#a63bff',stats:{topSpeed:92,acceleration:40,braking:45,grip:40,handling:35,weight:70,power:88,nitro:55,driftAbility:30}},
  {id:'falcon',name:'Falcon ZX',color:'#ffe62e',stats:{topSpeed:55,acceleration:92,braking:65,grip:60,handling:70,weight:30,power:60,nitro:65,driftAbility:50}},
  {id:'titan',name:'Titan RS',color:'#ff4444',stats:{topSpeed:70,acceleration:45,braking:80,grip:88,handling:55,weight:85,power:65,nitro:40,driftAbility:25}},
  {id:'eclipse',name:'Eclipse X',color:'#ff2e88',stats:{topSpeed:65,acceleration:60,braking:55,grip:45,handling:92,weight:35,power:55,nitro:70,driftAbility:95}},
  {id:'inferno',name:'Inferno R',color:'#ff6a2e',stats:{topSpeed:85,acceleration:70,braking:50,grip:50,handling:45,weight:60,power:90,nitro:80,driftAbility:40}},
  {id:'specter',name:'Specter',color:'#8affc1',stats:{topSpeed:60,acceleration:65,braking:90,grip:75,handling:80,weight:40,power:50,nitro:45,driftAbility:60}},
  {id:'venom',name:'Venom S',color:'#39ff6a',stats:{topSpeed:75,acceleration:78,braking:60,grip:65,handling:65,weight:45,power:75,nitro:85,driftAbility:55}},
  {id:'shadow',name:'Shadow GT',color:'#7d7dff',stats:{topSpeed:80,acceleration:50,braking:55,grip:55,handling:50,weight:55,power:72,nitro:50,driftAbility:45}},
  {id:'tempest',name:'Tempest X',color:'#ffd23f',stats:{topSpeed:68,acceleration:82,braking:70,grip:92,handling:85,weight:38,power:58,nitro:50,driftAbility:70}}
];

// ---------- PISTAS ----------
// Las 3 pistas ahora son r(theta) = radioBase + ondulaciones, siempre
// positivo y sin cruces consigo mismas (a diferencia de la lemniscata
// original de "Desierto"). Esto garantiza que nearestTrackIndex nunca
// pueda "saltar" a otra rama del circuito.
const TRACKS = [
  {id:'neon',name:'Circuito Neon',w:240,build:()=>{
    const p=[];
    for(let i=0;i<160;i++){
      const t=(i/160)*Math.PI*2;
      const r = 750 + Math.sin(t*3)*70;
      p.push({x:Math.cos(t)*r, y:Math.sin(t)*r*0.68});
    }
    return p;
  }},
  {id:'harbor',name:'Puerto',w:210,build:()=>{
    const p=[];
    for(let i=0;i<160;i++){
      const t=(i/160)*Math.PI*2;
      const r = 900 + Math.sin(t*2)*90;
      p.push({x:Math.cos(t)*r, y:Math.sin(t)*r*0.42});
    }
    return p;
  }},
  {id:'desert',name:'Desierto',w:250,build:()=>{
    const p=[];
    for(let i=0;i<170;i++){
      const t=(i/170)*Math.PI*2;
      const r = 820 + Math.sin(t*4)*60 + Math.cos(t*2)*50;
      p.push({x:Math.cos(t)*r, y:Math.sin(t)*r*0.6});
    }
    return p;
  }}
];

const DIFFS=['FÁCIL','NORMAL','DIFÍCIL','EXPERTO','LEYENDA'];
const RIVALS=[1,2,3,4,5,6,7];
const LAPS=[1,2,3,5];

// ---------- GUARDADO ----------
// window.storage es asíncrono y solo existe cuando el juego corre
// como artifact en Claude.ai. Si no está disponible (por ejemplo al
// abrir el archivo .html suelto en un navegador), se usa un estado
// en memoria: el juego funciona igual, solo no persiste entre
// sesiones.
function defaultSave(){
  return { sound: true, touch: 'auto', records: { lap: {}, topSpeed: 0, bestDrift: 0, wins: 0, streak: 0 } };
}

let SAVE = defaultSave();
const hasStorage = typeof window !== 'undefined' && !!window.storage;

async function loadSave(){
  if(!hasStorage) return defaultSave();
  try {
    const result = await window.storage.get('neonrush_save', false);
    if(result && result.value){
      const parsed = JSON.parse(result.value);
      if(parsed && typeof parsed === 'object' && parsed.records) return parsed;
    }
  } catch(e) {
    console.warn('No se pudo cargar el guardado, usando valores por defecto:', e);
  }
  return defaultSave();
}

async function saveData(d){
  if(!hasStorage) return;
  try {
    await window.storage.set('neonrush_save', JSON.stringify(d), false);
  } catch(e) {
    console.warn('Error guardando datos:', e);
  }
}

// ---------- ESTADO ----------
let vehicleIndex = 0;
let trackIndex = 0;
let diffIndex = 1;
let rivalIndex = 4;
let lapIndex = 2;
let race = null;
let paused = false;
let ended = false;
let lastConfig = null;
let animId = null;
let countdownInterval = null;

// ---------- CANVAS ----------
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ---------- AUDIO ----------
const audio = {
  ctx: null,
  enabled: true,
  osc: null,
  gain: null,
  filter: null,
  unlocked: false,

  ensure() {
    if(!this.ctx) {
      const A = window.AudioContext || window.webkitAudioContext;
      this.ctx = new A();
    }
    if(this.ctx.state === 'suspended') this.ctx.resume();
  },

  unlock() {
    if(this.unlocked) return;
    this.ensure();
    this.unlocked = true;
  },

  setEnabled(v) {
    this.enabled = v;
    if(!v) this.stopEngine();
  },

  tone(freq, duration, type, gainVal, sweepTo, delay) {
    if(!this.enabled) return;
    this.ensure();
    const osc = this.ctx.createOscillator();
    const gn = this.ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq || 440, this.ctx.currentTime + (delay || 0));
    if(sweepTo) {
      osc.frequency.linearRampToValueAtTime(sweepTo, this.ctx.currentTime + (delay || 0) + (duration || 0.15));
    }
    gn.gain.setValueAtTime(gainVal || 0.15, this.ctx.currentTime + (delay || 0));
    gn.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + (delay || 0) + (duration || 0.15));
    osc.connect(gn).connect(this.ctx.destination);
    osc.start(this.ctx.currentTime + (delay || 0));
    osc.stop(this.ctx.currentTime + (delay || 0) + (duration || 0.15) + 0.02);
  },

  noise(duration, gainVal, filterFreq) {
    if(!this.enabled) return;
    this.ensure();
    const bufferSize = Math.max(1, Math.floor(this.ctx.sampleRate * (duration || 0.2)));
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const source = this.ctx.createBufferSource();
    source.buffer = buffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = filterFreq || 1200;
    const gn = this.ctx.createGain();
    gn.gain.setValueAtTime(gainVal || 0.12, this.ctx.currentTime);
    gn.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + (duration || 0.2));
    source.connect(filter).connect(gn).connect(this.ctx.destination);
    source.start();
  },

  startEngine() {
    this.stopEngine(); // asegura que nunca queden osciladores huérfanos de una carrera anterior
    if(!this.enabled) return;
    this.ensure();
    const osc = this.ctx.createOscillator();
    osc.type = 'sawtooth';
    const gn = this.ctx.createGain();
    gn.gain.value = 0.03;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 500;
    osc.connect(filter).connect(gn).connect(this.ctx.destination);
    osc.frequency.value = 60;
    osc.start();
    this.osc = osc;
    this.gain = gn;
    this.filter = filter;
  },

  updateEngine(speedRatio) {
    if(!this.osc || !this.enabled) return;
    const freq = 55 + Math.min(1, Math.abs(speedRatio)) * 180;
    this.osc.frequency.setTargetAtTime(freq, this.ctx.currentTime, 0.05);
    if(this.filter) {
      this.filter.frequency.setTargetAtTime(400 + Math.abs(speedRatio) * 1800, this.ctx.currentTime, 0.05);
    }
  },

  stopEngine() {
    if(this.osc) {
      try { this.osc.stop(); } catch(e) {}
      try { this.osc.disconnect(); } catch(e) {}
      this.osc = null;
    }
    if(this.gain) {
      try { this.gain.disconnect(); } catch(e) {}
      this.gain = null;
    }
    if(this.filter) {
      try { this.filter.disconnect(); } catch(e) {}
      this.filter = null;
    }
  },

  nitro() { this.tone(220, 0.4, 'sawtooth', 0.18, 700); },
  drift() { this.noise(0.15, 0.06, 2000); },
  crash() { this.noise(0.18, 0.2, 600); this.tone(90, 0.15, 'square', 0.15); },
  click() { this.tone(700, 0.06, 'square', 0.08); },
  beep(isFinal) { this.tone(isFinal ? 880 : 440, isFinal ? 0.3 : 0.15, 'sine', 0.2); },
  win() { [523,659,784,1046].forEach((f,i) => this.tone(f, 0.25, 'triangle', 0.18, null, i * 0.12)); },
  lose() { [400,340,260].forEach((f,i) => this.tone(f, 0.3, 'sawtooth', 0.15, null, i * 0.15)); }
};

// ---------- PARTICULAS ----------
const particles = {
  list: [],
  max: 400,

  add(p) {
    if(this.list.length >= this.max) this.list.shift();
    this.list.push(p);
  },

  smoke(x, y) {
    this.add({
      x, y,
      vx: (Math.random() - 0.5) * 20,
      vy: (Math.random() - 0.5) * 20,
      life: 0.5 + Math.random() * 0.4,
      age: 0,
      size: 6 + Math.random() * 6,
      grow: 18,
      color: 'rgba(200,200,210,ALPHA)'
    });
  },

  flame(x, y, angle) {
    const spread = (Math.random() - 0.5) * 0.6;
    const speed = 140 + Math.random() * 60;
    this.add({
      x, y,
      vx: Math.cos(angle + Math.PI + spread) * speed,
      vy: Math.sin(angle + Math.PI + spread) * speed,
      life: 0.25 + Math.random() * 0.15,
      age: 0,
      size: 4 + Math.random() * 4,
      grow: -4,
      color: Math.random() > 0.5 ? 'rgba(46,242,255,ALPHA)' : 'rgba(166,59,255,ALPHA)'
    });
  },

  spark(x, y) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 80 + Math.random() * 120;
    this.add({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.2 + Math.random() * 0.2,
      age: 0,
      size: 2 + Math.random() * 2,
      grow: 0,
      color: 'rgba(255,230,46,ALPHA)'
    });
  },

  update(dt) {
    for(let i = this.list.length - 1; i >= 0; i--) {
      const p = this.list[i];
      p.age += dt;
      if(p.age >= p.life) {
        this.list.splice(i, 1);
        continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.size += p.grow * dt;
    }
  },

  clear() { this.list.length = 0; },

  draw(ctx) {
    for(const p of this.list) {
      const alpha = Math.max(0, 1 - p.age / p.life);
      ctx.fillStyle = p.color.replace('ALPHA', alpha.toFixed(2));
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(0.5, p.size), 0, Math.PI * 2);
      ctx.fill();
    }
  }
};

// ---------- FISICA ----------
function statsToPhys(s) {
  return {
    maxSpeed: 260 + s.topSpeed * 5.4,
    accelForce: 220 + s.acceleration * 9.5,
    brakeForce: 500 + s.braking * 9,
    grip: 0.10 + (s.grip / 100) * 0.35,
    turnRate: 1.4 + (s.handling / 100) * 2.2,
    mass: 0.7 + (s.weight / 100) * 0.9,
    nitroPower: 260 + s.nitro * 6.5,
    nitroMaxSpeedBonus: 60 + s.nitro * 2.2,
    driftGripLoss: 0.55 - (s.driftAbility / 100) * 0.35
  };
}

function createBody(x, y, angle, stats) {
  const phys = statsToPhys(stats);
  return {
    x, y, angle: angle,
    vx: 0, vy: 0,
    speed: 0,
    isDrifting: false,
    driftDuration: 0,
    driftPoints: 0,
    bestDrift: 0,
    nitroFuel: 100,
    nitroActive: false,
    damage: 0,
    physics: phys
  };
}

function updatePhysics(body, input, dt, surface) {
  const phys = body.physics;
  const surf = surface || { grip: 1 };

  if(body.damage >= 100) {
    input = { throttle: 0, brake: 0, steer: 0, handbrake: false, nitro: false };
  }

  const forward = { x: Math.cos(body.angle), y: Math.sin(body.angle) };
  const right = { x: -forward.y, y: forward.x };

  const forwardSpeed = body.vx * forward.x + body.vy * forward.y;

  body.nitroActive = input.nitro && body.nitroFuel > 1 && body.damage < 100;
  if(body.nitroActive) {
    body.nitroFuel = Math.max(0, body.nitroFuel - dt * 25);
  }

  const maxSpeed = phys.maxSpeed + (body.nitroActive ? phys.nitroMaxSpeedBonus : 0);

  let accel = 0;
  if(input.throttle > 0) {
    accel = phys.accelForce * input.throttle * (body.nitroActive ? 1.6 : 1);
    if(body.nitroActive) accel += phys.nitroPower * 0.4;
  } else if(input.brake > 0) {
    if(forwardSpeed > 5) {
      accel = -phys.brakeForce * input.brake;
    } else {
      accel = -phys.accelForce * 0.6 * input.brake;
    }
  }

  body.vx += forward.x * accel * dt;
  body.vy += forward.y * accel * dt;

  const drag = Math.max(0, 1 - dt * 0.35);
  body.vx *= drag;
  body.vy *= drag;

  const wasDrifting = body.isDrifting;
  const movingFast = Math.abs(forwardSpeed) > 60;
  body.isDrifting = input.handbrake && movingFast && body.damage < 100;

  const effectiveGrip = (body.isDrifting ? phys.driftGripLoss : phys.grip) * (surf.grip || 1);

  const fSpd = body.vx * forward.x + body.vy * forward.y;
  const lSpd = body.vx * right.x + body.vy * right.y;
  const newLateral = lSpd * (1 - Math.min(1, effectiveGrip * dt * 60 * 0.06));

  body.vx = forward.x * fSpd + right.x * newLateral;
  body.vy = forward.y * fSpd + right.y * newLateral;

  const speedMag = Math.hypot(body.vx, body.vy);
  const speedFactor = Math.min(1, 0.25 + speedMag / phys.maxSpeed);
  const directionSign = fSpd < -5 ? -1 : 1;
  let steer = input.steer * phys.turnRate * speedFactor * directionSign * dt;
  if(body.isDrifting) steer *= 1.6;
  body.angle += steer;

  const totalSpeed = Math.hypot(body.vx, body.vy);
  if(totalSpeed > maxSpeed * 1.1) {
    const scale = maxSpeed / totalSpeed;
    body.vx *= scale;
    body.vy *= scale;
  }

  if(body.isDrifting) {
    body.driftDuration += dt;
    body.driftPoints += dt * 15;
    if(body.driftPoints > body.bestDrift) body.bestDrift = body.driftPoints;
    body.nitroFuel = Math.min(100, body.nitroFuel + dt * 14);
  } else if(wasDrifting) {
    body.driftDuration = 0;
    body.driftPoints = 0;
  }

  if(!body.isDrifting && speedMag > phys.maxSpeed * 0.75) {
    body.nitroFuel = Math.min(100, body.nitroFuel + dt * 4);
  }

  body.x += body.vx * dt;
  body.y += body.vy * dt;
  body.speed = fSpd;

  return body;
}

function resolveCollision(a, b, radius) {
  radius = radius || 22;
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const dist = Math.hypot(dx, dy) || 0.001;
  const minDist = radius * 2;
  if(dist >= minDist) return false;

  const nx = dx / dist;
  const ny = dy / dist;
  const overlap = (minDist - dist) / 2;

  const totalMass = a.physics.mass + b.physics.mass;
  const aPush = b.physics.mass / totalMass;
  const bPush = a.physics.mass / totalMass;

  a.x -= nx * overlap * aPush;
  a.y -= ny * overlap * aPush;
  b.x += nx * overlap * bPush;
  b.y += ny * overlap * bPush;

  const relVx = b.vx - a.vx;
  const relVy = b.vy - a.vy;
  const relSpeed = relVx * nx + relVy * ny;

  if(relSpeed < 0) {
    const impulse = -relSpeed * 0.6;
    a.vx -= nx * impulse * aPush;
    a.vy -= ny * impulse * aPush;
    b.vx += nx * impulse * bPush;
    b.vy += ny * impulse * bPush;

    const impactSpeed = Math.abs(relSpeed);
    const damageThisHit = Math.min(3.5, impactSpeed * 0.0015);
    a.damage = Math.min(100, a.damage + damageThisHit);
    b.damage = Math.min(100, b.damage + damageThisHit);
  }
  return true;
}

// ---------- VEHICULO ----------
let vehicleUID = 0;

class Vehicle {
  constructor({ def, x, y, angle, isPlayer = false, driverName = '' }) {
    this.uid = 'v' + (vehicleUID++);
    this.def = def;
    this.isPlayer = isPlayer;
    this.driverName = driverName || def.name;
    this.body = createBody(x, y, angle, def.stats);
    this.progress = null;
    this._lightCache = {};
    this._darkCache = {};
  }

  get x() { return this.body.x; }
  get y() { return this.body.y; }
  get angle() { return this.body.angle; }
  get speedKmh() { return Math.abs(this.body.speed) * 3; }

  update(input, dt, surface) {
    updatePhysics(this.body, input, dt, surface);
  }

  draw(ctx) {
    const body = this.body;
    const color = this.def.color;
    const len = 30;
    const wid = 16;

    ctx.save();
    ctx.translate(body.x, body.y);
    ctx.rotate(body.angle);

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(-len/2 + 2, -wid/2 + 3, len, wid);

    const grad = ctx.createLinearGradient(-len/2, -wid/2, len/2, wid/2);
    grad.addColorStop(0, this._lighten(color, 30));
    grad.addColorStop(0.5, color);
    grad.addColorStop(1, this._darken(color, 30));
    ctx.fillStyle = grad;
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(len/2, 0);
    ctx.lineTo(len/2 - 8, -wid/2);
    ctx.lineTo(-len/2 + 4, -wid/2);
    ctx.lineTo(-len/2, 0);
    ctx.lineTo(-len/2 + 4, wid/2);
    ctx.lineTo(len/2 - 8, wid/2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = 'rgba(10,10,20,0.75)';
    ctx.fillRect(-4, -wid/2 + 3, 12, wid - 6);

    if(body.nitroActive) {
      ctx.fillStyle = 'rgba(46,242,255,0.85)';
      ctx.beginPath();
      ctx.moveTo(-len/2, -3);
      ctx.lineTo(-len/2 - 12 - Math.random() * 8, 0);
      ctx.lineTo(-len/2, 3);
      ctx.closePath();
      ctx.fill();
    }

    if(this.isPlayer) {
      ctx.strokeStyle = 'rgba(255,230,46,0.8)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, len * 0.85, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  // Los colores claros/oscuros se cachean por vehículo: antes se
  // recalculaban con parseInt/toString en CADA frame para CADA coche.
  _lighten(color, amount) {
    if(this._lightCache[amount]) return this._lightCache[amount];
    const hex = color.replace('#', '');
    const r = Math.min(255, parseInt(hex.substr(0,2), 16) + amount);
    const g = Math.min(255, parseInt(hex.substr(2,2), 16) + amount);
    const b = Math.min(255, parseInt(hex.substr(4,2), 16) + amount);
    const out = '#' + [r,g,b].map(c => c.toString(16).padStart(2, '0')).join('');
    this._lightCache[amount] = out;
    return out;
  }

  _darken(color, amount) {
    if(this._darkCache[amount]) return this._darkCache[amount];
    const hex = color.replace('#', '');
    const r = Math.max(0, parseInt(hex.substr(0,2), 16) - amount);
    const g = Math.max(0, parseInt(hex.substr(2,2), 16) - amount);
    const b = Math.max(0, parseInt(hex.substr(4,2), 16) - amount);
    const out = '#' + [r,g,b].map(c => c.toString(16).padStart(2, '0')).join('');
    this._darkCache[amount] = out;
    return out;
  }
}

// ---------- PISTA ----------
function buildTrack(def) {
  const points = def.build();
  const N = points.length;
  const cumLen = [0];
  for(let i = 1; i <= N; i++) {
    const a = points[(i - 1) % N];
    const b = points[i % N];
    cumLen.push(cumLen[i - 1] + Math.hypot(b.x - a.x, b.y - a.y));
  }
  const totalLength = cumLen[N];
  const checkpoints = [];
  for(let i = 0; i < 8; i++) {
    checkpoints.push(Math.floor((i / 8) * N));
  }

  // Limites del minimapa precalculados UNA sola vez (antes se
  // recorrían todos los puntos en cada frame dentro del bucle
  // principal).
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for(const p of points) {
    if(p.x < minX) minX = p.x; if(p.x > maxX) maxX = p.x;
    if(p.y < minY) minY = p.y; if(p.y > maxY) maxY = p.y;
  }
  const pad = 40;
  const w = maxX - minX + pad * 2;
  const h = maxY - minY + pad * 2;
  const mapScale = Math.min(150 / w, 150 / h);
  const mapOffX = 75 - ((minX + maxX) / 2) * mapScale;
  const mapOffY = 75 - ((minY + maxY) / 2) * mapScale;

  return {
    id: def.id,
    name: def.name,
    width: def.w,
    points: points,
    N: N,
    cumLen: cumLen,
    totalLength: totalLength,
    checkpoints: checkpoints,
    startPoint: points[0],
    startDirection: Math.atan2(points[1].y - points[0].y, points[1].x - points[0].x),
    mapScale, mapOffX, mapOffY
  };
}

function nearestTrackIndex(track, x, y, hint) {
  const { points, N } = track;
  let start = 0, end = N;
  if(hint >= 0) {
    start = hint - 12;
    end = hint + 12;
  }
  let best = 0;
  let bestDist = Infinity;
  for(let i = start; i < end; i++) {
    const idx = ((i % N) + N) % N;
    const p = points[idx];
    const d = (p.x - x) ** 2 + (p.y - y) ** 2;
    if(d < bestDist) {
      bestDist = d;
      best = idx;
    }
  }
  return { index: best, distance: Math.sqrt(bestDist) };
}

function drawTrack(ctx, track) {
  const { points, width } = track;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  ctx.beginPath();
  points.forEach((p, i) => {
    i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
  });
  ctx.closePath();
  ctx.strokeStyle = '#26263a';
  ctx.lineWidth = width;
  ctx.stroke();

  ctx.strokeStyle = 'rgba(46,242,255,0.3)';
  ctx.lineWidth = width + 6;
  ctx.stroke();

  ctx.strokeStyle = '#26263a';
  ctx.lineWidth = width - 4;
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 3;
  ctx.setLineDash([20, 18]);
  ctx.stroke();
  ctx.setLineDash([]);

  const start = track.startPoint;
  const next = track.points[1];
  const dx = next.x - start.x;
  const dy = next.y - start.y;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len;
  const ny = dx / len;
  ctx.strokeStyle = '#ffe62e';
  ctx.lineWidth = 6;
  ctx.setLineDash([8, 8]);
  ctx.beginPath();
  ctx.moveTo(start.x + nx * width/2, start.y + ny * width/2);
  ctx.lineTo(start.x - nx * width/2, start.y - ny * width/2);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.restore();
}

// ---------- PROGRESO ----------
function createProgress(track) {
  return {
    trackIndexHint: 0,
    nextCheckpoint: 0,
    lap: 0,
    finished: false,
    finishTime: null,
    lapTimes: [],
    currentLapStart: 0,
    totalProgress: 0,
    wrongWay: false
  };
}

function updateProgress(track, progress, x, y, elapsed, totalLaps) {
  const { index } = nearestTrackIndex(track, x, y, progress.trackIndexHint);
  progress.trackIndexHint = index;

  const arc = index / track.N;
  progress.totalProgress = progress.lap + arc;

  // Deteccion de sentido contrario: si estamos mas cerca del
  // checkpoint anterior que del siguiente, vamos al reves.
  const cpIndex = track.checkpoints[progress.nextCheckpoint];
  const cpPoint = track.points[cpIndex];
  const prevCpIndex = track.checkpoints[(progress.nextCheckpoint - 1 + track.checkpoints.length) % track.checkpoints.length];
  const prevCpPoint = track.points[prevCpIndex];

  const distToCurrent = Math.hypot(x - cpPoint.x, y - cpPoint.y);
  const distToPrev = Math.hypot(x - prevCpPoint.x, y - prevCpPoint.y);

  progress.wrongWay = distToPrev < distToCurrent && distToPrev < 120;

  // Checkpoint: la vuelta se cuenta cuando volvemos a pasar por el
  // checkpoint 0 tras haber recorrido todos los demas en orden.
  if(!progress.wrongWay && distToCurrent < 150) {
    progress.nextCheckpoint = (progress.nextCheckpoint + 1) % track.checkpoints.length;

    if(progress.nextCheckpoint === 0) {
      const lapTime = elapsed - progress.currentLapStart;
      progress.lapTimes.push(lapTime);
      progress.currentLapStart = elapsed;
      progress.lap += 1;
      progress.totalProgress = progress.lap + arc;

      if(progress.lap >= totalLaps && !progress.finished) {
        progress.finished = true;
        progress.finishTime = elapsed;
      }
    }
  }

  return progress;
}

// ---------- IA ----------
function aiInput(vehicle, track, difficulty) {
  const lookAhead = difficulty === 'FÁCIL' ? 5 : difficulty === 'NORMAL' ? 6 : difficulty === 'DIFÍCIL' ? 7 : difficulty === 'EXPERTO' ? 8 : 9;
  const skill = difficulty === 'FÁCIL' ? 0.55 : difficulty === 'NORMAL' ? 0.7 : difficulty === 'DIFÍCIL' ? 0.82 : difficulty === 'EXPERTO' ? 0.92 : 1.0;

  const body = vehicle.body;
  const hint = vehicle.progress.trackIndexHint || 0;
  const N = track.N;

  const idx = (hint + lookAhead) % N;
  const target = track.points[idx];

  const toTargetAngle = Math.atan2(target.y - body.y, target.x - body.x);
  let angleDiff = toTargetAngle - body.angle;
  while(angleDiff > Math.PI) angleDiff -= Math.PI * 2;
  while(angleDiff < -Math.PI) angleDiff += Math.PI * 2;

  let steer = Math.max(-1, Math.min(1, (angleDiff / (Math.PI / 3)) * skill));

  const farIdx = (hint + lookAhead + 4) % N;
  const farPoint = track.points[farIdx];
  const curveAngle = Math.atan2(farPoint.y - target.y, farPoint.x - target.x);
  let curveDiff = curveAngle - toTargetAngle;
  while(curveDiff > Math.PI) curveDiff -= Math.PI * 2;
  while(curveDiff < -Math.PI) curveDiff += Math.PI * 2;
  const sharpness = Math.min(1, Math.abs(curveDiff) / 1.4);

  let throttle = 0.9 * (1 - sharpness * 0.5);
  let brake = 0;
  if(sharpness > 0.6 && Math.abs(body.speed) > body.physics.maxSpeed * 0.5) {
    brake = sharpness;
    throttle = 0;
  }
  throttle = Math.max(0, Math.min(1, throttle));

  const handbrake = sharpness > 0.7 && Math.abs(body.speed) > body.physics.maxSpeed * 0.5 && Math.random() < 0.5;
  let nitro = false;
  if(sharpness < 0.2 && body.nitroFuel > 30) {
    nitro = Math.random() < 0.02;
  }

  return { throttle, brake, steer, handbrake, nitro };
}

// ---------- CARRERA ----------
class RaceManager {
  constructor(config) {
    this.track = buildTrack(config.track);
    this.difficulty = config.difficulty;
    this.laps = config.laps;
    this.state = 'COUNTDOWN';
    this.countdown = 3.2;
    this.elapsed = 0;
    this.particlesRequests = [];
    this.vehicles = [];
    this.standings = [];
    this.player = null;
    this.finishTime = 0;

    const playerDef = VEHICLES[config.vehicleIndex];
    const start = this.track.startPoint;
    const startAngle = this.track.startDirection;

    const player = new Vehicle({
      def: playerDef,
      x: start.x,
      y: start.y,
      angle: startAngle,
      isPlayer: true,
      driverName: '🏁 TÚ'
    });
    player.progress = createProgress(this.track);
    this.vehicles.push(player);
    this.player = player;

    const numRivals = config.rivals;
    const shuffled = VEHICLES.filter(v => v.id !== playerDef.id).sort(() => Math.random() - 0.5);
    const normal = { x: -Math.sin(startAngle), y: Math.cos(startAngle) };

    for(let i = 0; i < numRivals; i++) {
      const def = shuffled[i % shuffled.length];
      const row = Math.floor(i / 2) + 1;
      const side = i % 2 === 0 ? 1 : -1;
      const offsetBack = row * 46;
      const offsetSide = side * 34;
      const sx = start.x - Math.cos(startAngle) * offsetBack + normal.x * offsetSide;
      const sy = start.y - Math.sin(startAngle) * offsetBack + normal.y * offsetSide;

      const nombre = TUS_CORREDORES[i % TUS_CORREDORES.length];
      const rival = new Vehicle({
        def: def,
        x: sx,
        y: sy,
        angle: startAngle,
        isPlayer: false,
        driverName: nombre
      });
      rival.progress = createProgress(this.track);
      this.vehicles.push(rival);
    }
  }

  update(dt, playerInput, surface) {
    this.particlesRequests.length = 0;

    if(this.state === 'COUNTDOWN') {
      this.countdown -= dt;
      if(this.countdown <= 0) this.state = 'RACING';
      return;
    }

    if(this.state === 'FINISHED') return;

    this.elapsed += dt;

    for(const v of this.vehicles) {
      let input;
      if(v.isPlayer) {
        input = playerInput;
        // Sentido contrario penaliza: como si condujeras sobre grava.
        if(v.progress.wrongWay) {
          input = { ...input, throttle: input.throttle * 0.4 };
        }
      } else {
        input = aiInput(v, this.track, this.difficulty);
      }
      v.update(input, dt, surface || { grip: 1 });

      if(v.body.isDrifting) {
        this.particlesRequests.push({ type: 'smoke', x: v.x, y: v.y });
      }
      if(v.body.nitroActive) {
        this.particlesRequests.push({
          type: 'nitro',
          x: v.x - Math.cos(v.angle) * 16,
          y: v.y - Math.sin(v.angle) * 16,
          angle: v.angle
        });
      }
    }

    // Colisiones vehiculo-vehiculo
    for(let i = 0; i < this.vehicles.length; i++) {
      for(let j = i + 1; j < this.vehicles.length; j++) {
        if(resolveCollision(this.vehicles[i].body, this.vehicles[j].body)) {
          this.particlesRequests.push({
            type: 'spark',
            x: this.vehicles[i].x,
            y: this.vehicles[i].y
          });
        }
      }
    }

    // Colisiones con bordes de pista
    for(const v of this.vehicles) {
      const { index } = nearestTrackIndex(this.track, v.x, v.y, v.progress.trackIndexHint);
      const center = this.track.points[index];
      const dist = Math.hypot(v.x - center.x, v.y - center.y);
      const halfWidth = this.track.width / 2;

      if(dist > halfWidth) {
        const penalty = Math.min(1, (dist - halfWidth) / halfWidth);
        v.body.vx *= (1 - penalty * 0.08);
        v.body.vy *= (1 - penalty * 0.08);
        v.body.damage = Math.min(100, v.body.damage + penalty * 0.3);

        const angle = Math.atan2(v.y - center.y, v.x - center.x);
        const push = Math.min(20, (dist - halfWidth + 10) * 0.3);
        v.body.x -= Math.cos(angle) * push;
        v.body.y -= Math.sin(angle) * push;

        if(!v.body.isDrifting) {
          this.particlesRequests.push({ type: 'spark', x: v.x, y: v.y });
        }
      }
    }

    // Progreso
    for(const v of this.vehicles) {
      updateProgress(this.track, v.progress, v.x, v.y, this.elapsed, this.laps);
    }

    // Clasificacion
    const finished = this.vehicles.filter(v => v.progress.finished);
    const racing = this.vehicles.filter(v => !v.progress.finished);

    finished.sort((a, b) => a.progress.finishTime - b.progress.finishTime);
    racing.sort((a, b) => b.progress.totalProgress - a.progress.totalProgress);

    this.standings = [...finished, ...racing];

    // Fin de carrera: termina apenas el jugador cruza la meta (no
    // hace falta esperar a que las IAs terminen tambien).
    if(this.state !== 'FINISHED' && this.player.progress.finished) {
      this.state = 'FINISHED';
      this.finishTime = this.player.progress.finishTime;
    }
  }

  getPlayerPosition() {
    const idx = this.standings.indexOf(this.player);
    return idx + 1;
  }
}

// ---------- UI ----------
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function updateStats(index) {
  const v = VEHICLES[index];
  document.getElementById('v-name').textContent = v.name;
  const stats = document.getElementById('v-stats');
  stats.innerHTML = '';
  const labels = {
    topSpeed: 'Vel.máx',
    acceleration: 'Aceleración',
    braking: 'Frenado',
    grip: 'Agarre',
    handling: 'Manejo',
    nitro: 'Nitro',
    driftAbility: 'Derrape'
  };
  Object.entries(labels).forEach(([key, label]) => {
    const val = v.stats[key];
    const div = document.createElement('div');
    div.className = 'stat';
    div.innerHTML = `<span style="width:70px">${label}</span><div class="bar"><div class="fill" style="width:${val}%"></div></div>`;
    stats.appendChild(div);
  });
}

function updateSetup() {
  document.getElementById('t-name').textContent = TRACKS[trackIndex].name;
  document.getElementById('d-name').textContent = DIFFS[diffIndex];
  document.getElementById('r-name').textContent = RIVALS[rivalIndex];
  document.getElementById('l-name').textContent = LAPS[lapIndex];
  updateStats(vehicleIndex);
}

function renderRecords() {
  const list = document.getElementById('records-list');
  list.innerHTML = '';
  TRACKS.forEach(t => {
    const best = SAVE.records.lap[t.id];
    list.innerHTML += `<div class="record-row"><span>${t.name}</span><span>${best ? best.toFixed(2) + 's' : '—'}</span></div>`;
  });
  list.innerHTML += `<div class="record-row"><span>🏆 Velocidad máxima</span><span>${Math.round(SAVE.records.topSpeed)} km/h</span></div>`;
  list.innerHTML += `<div class="record-row"><span>💨 Mejor derrape</span><span>${Math.round(SAVE.records.bestDrift)} pts</span></div>`;
  list.innerHTML += `<div class="record-row"><span>🏁 Victorias</span><span>${SAVE.records.wins}</span></div>`;
}

// ---------- MENU ----------
document.querySelectorAll('[data-action]').forEach(btn => {
  btn.addEventListener('click', () => {
    const action = btn.dataset.action;
    audio.unlock();
    audio.click();

    switch(action) {
      case 'quick':
        showScreen('screen-quick');
        updateSetup();
        break;
      case 'records':
        showScreen('screen-records');
        renderRecords();
        break;
      case 'settings':
        showScreen('screen-settings');
        document.getElementById('sound-val').textContent = SAVE.sound ? 'ACTIVADO' : 'DESACTIVADO';
        document.getElementById('touch-val').textContent = SAVE.touch.toUpperCase();
        break;
      case 'back':
        showScreen('screen-main');
        break;
      case 'start':
        startRace();
        break;
      case 'retry':
        if(lastConfig) startRace();
        break;
      case 'resume':
        paused = false;
        document.getElementById('pause-menu').classList.add('hidden');
        break;
      case 'restart':
        paused = false;
        document.getElementById('pause-menu').classList.add('hidden');
        if(lastConfig) startRace();
        break;
      case 'quit':
        paused = false;
        document.getElementById('pause-menu').classList.add('hidden');
        endRace();
        break;
    }
  });
});

// Selectores
document.querySelectorAll('.arrow-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const dir = parseInt(btn.dataset.dir);
    const parent = btn.closest('.setup-select');
    if(parent.id === 'sel-vehicle') {
      vehicleIndex = (vehicleIndex + dir + VEHICLES.length) % VEHICLES.length;
    } else if(parent.id === 'sel-track') {
      trackIndex = (trackIndex + dir + TRACKS.length) % TRACKS.length;
    } else if(parent.id === 'sel-diff') {
      diffIndex = (diffIndex + dir + DIFFS.length) % DIFFS.length;
    } else if(parent.id === 'sel-rivals') {
      rivalIndex = (rivalIndex + dir + RIVALS.length) % RIVALS.length;
    } else if(parent.id === 'sel-laps') {
      lapIndex = (lapIndex + dir + LAPS.length) % LAPS.length;
    }
    if(parent.id === 'sel-vehicle' || parent.id === 'sel-track' || parent.id === 'sel-diff' || parent.id === 'sel-rivals' || parent.id === 'sel-laps') {
      updateSetup();
    }
  });
});

// Configuracion
document.querySelectorAll('#toggle-sound .arrow-btn').forEach(b => {
  b.addEventListener('click', () => {
    SAVE.sound = !SAVE.sound;
    audio.setEnabled(SAVE.sound);
    saveData(SAVE);
    document.getElementById('sound-val').textContent = SAVE.sound ? 'ACTIVADO' : 'DESACTIVADO';
  });
});

document.querySelectorAll('#toggle-touch .arrow-btn').forEach(b => {
  b.addEventListener('click', () => {
    const opts = ['AUTO', 'ON', 'OFF'];
    const cur = opts.indexOf(SAVE.touch.toUpperCase());
    SAVE.touch = opts[(cur + 1) % opts.length];
    saveData(SAVE);
    document.getElementById('touch-val').textContent = SAVE.touch.toUpperCase();
    applyTouchControls();
  });
});

// ---------- CONTROLES ----------
const keys = new Set();

window.addEventListener('keydown', e => {
  keys.add(e.code);
  if(e.code === 'Escape') {
    if(race && document.getElementById('screen-race').classList.contains('active')) {
      paused = !paused;
      document.getElementById('pause-menu').classList.toggle('hidden', !paused);
    }
  }
});

window.addEventListener('keyup', e => keys.delete(e.code));

const touchState = { left: false, right: false, accel: false, brake: false, handbrake: false, nitro: false };

['btn-left', 'btn-right', 'btn-accel', 'btn-brake', 'btn-handbrake', 'btn-nitro'].forEach(id => {
  const el = document.getElementById(id);
  if(!el) return;
  const key = id === 'btn-left' ? 'left' : id === 'btn-right' ? 'right' : id === 'btn-accel' ? 'accel' : id === 'btn-brake' ? 'brake' : id === 'btn-handbrake' ? 'handbrake' : 'nitro';

  el.addEventListener('touchstart', e => { e.preventDefault(); touchState[key] = true; });
  el.addEventListener('touchend', e => { e.preventDefault(); touchState[key] = false; });
  el.addEventListener('touchcancel', () => { touchState[key] = false; });
  el.addEventListener('mousedown', () => touchState[key] = true);
  el.addEventListener('mouseup', () => touchState[key] = false);
  el.addEventListener('mouseleave', () => touchState[key] = false);
});

function getInput() {
  const left = keys.has('KeyA') || keys.has('ArrowLeft') || touchState.left;
  const right = keys.has('KeyD') || keys.has('ArrowRight') || touchState.right;
  const up = keys.has('KeyW') || keys.has('ArrowUp') || touchState.accel;
  const down = keys.has('KeyS') || keys.has('ArrowDown') || touchState.brake;

  return {
    throttle: up ? 1 : 0,
    brake: down ? 1 : 0,
    steer: (left ? -1 : 0) + (right ? 1 : 0),
    handbrake: keys.has('Space') || touchState.handbrake,
    nitro: keys.has('ShiftLeft') || keys.has('ShiftRight') || touchState.nitro
  };
}

function applyTouchControls() {
  const tc = document.getElementById('touch-controls');
  const coarse = window.matchMedia('(pointer: coarse)').matches;
  const setting = SAVE.touch;
  tc.classList.toggle('hidden', !((setting === 'ON') || (setting !== 'OFF' && coarse)));
}

// ---------- CARRERA ----------
function startRace() {
  lastConfig = {
    vehicleIndex: vehicleIndex,
    track: TRACKS[trackIndex],
    difficulty: DIFFS[diffIndex],
    rivals: RIVALS[rivalIndex],
    laps: LAPS[lapIndex]
  };

  if(countdownInterval) {
    clearInterval(countdownInterval);
    countdownInterval = null;
  }

  particles.clear();
  race = new RaceManager(lastConfig);
  paused = false;
  ended = false;

  document.getElementById('pause-menu').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('countdown-overlay').classList.remove('hidden');
  document.getElementById('btn-pause').classList.remove('hidden');
  document.getElementById('hud-wrongway').classList.remove('show');
  showScreen('screen-race');
  applyTouchControls();

  audio.unlock();
  audio.startEngine();

  let beeped2 = false, beeped1 = false, beepedFinal = false;

  countdownInterval = setInterval(() => {
    const c = race.countdown;
    const num = c > 1 ? Math.ceil(c) : 'GO!';
    document.getElementById('countdown-number').textContent = num;

    if(c <= 2 && !beeped2) { beeped2 = true; audio.beep(false); }
    if(c <= 1 && !beeped1) { beeped1 = true; audio.beep(false); }
    if(c <= 0) {
      if(!beepedFinal) { beepedFinal = true; audio.beep(true); }
      document.getElementById('countdown-overlay').classList.add('hidden');
      if(countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }
    }
  }, 50);

  if(animId) {
    cancelAnimationFrame(animId);
    animId = null;
  }
  lastTime = 0;
  animId = requestAnimationFrame(gameLoop);
}

function endRace() {
  if(countdownInterval) {
    clearInterval(countdownInterval);
    countdownInterval = null;
  }
  audio.stopEngine();
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('btn-pause').classList.add('hidden');
  document.getElementById('touch-controls').classList.add('hidden');
  showScreen('screen-main');
  race = null;
}

function showResults() {
  ended = true;
  audio.stopEngine();

  if(countdownInterval) {
    clearInterval(countdownInterval);
    countdownInterval = null;
  }

  const pos = race.getPlayerPosition();
  const won = pos === 1;
  won ? audio.win() : audio.lose();

  const player = race.player;
  const bestLap = player.progress.lapTimes.length ? Math.min(...player.progress.lapTimes) : 0;

  document.getElementById('results-title').textContent = won ? '🏆 ¡VICTORIA!' : '🏁 ' + pos + 'º LUGAR';

  const list = document.getElementById('results-list');
  list.innerHTML = '';

  race.standings.forEach((v, i) => {
    const row = document.createElement('div');
    row.className = 'record-row';
    const cls = i === 0 ? 'color:#ffe62e;font-weight:700' : i === 1 ? 'color:#cfd4e0' : i === 2 ? 'color:#d99a5a' : '';
    const nombre = v.isPlayer ? '🏁 TÚ' : v.driverName;
    row.innerHTML = `<span style="${cls}">${i + 1}º ${nombre}</span><span>${v.progress.finishTime ? v.progress.finishTime.toFixed(2) + 's' : '—'}</span>`;
    if(v.isPlayer) row.style.borderLeft = '3px solid #ffe62e';
    list.appendChild(row);
  });

  // Guardar records
  if(bestLap > 0) {
    if(!SAVE.records.lap[race.track.id] || bestLap < SAVE.records.lap[race.track.id]) {
      SAVE.records.lap[race.track.id] = bestLap;
    }
  }
  if(player.speedKmh > SAVE.records.topSpeed) {
    SAVE.records.topSpeed = player.speedKmh;
  }
  if(player.body.bestDrift > SAVE.records.bestDrift) {
    SAVE.records.bestDrift = player.body.bestDrift;
  }
  if(won) {
    SAVE.records.wins += 1;
    SAVE.records.streak += 1;
  } else {
    SAVE.records.streak = 0;
  }
  saveData(SAVE);

  showScreen('screen-results');
}

// ---------- BUCLE PRINCIPAL ----------
let lastTime = 0;

function gameLoop(time = 0) {
  animId = requestAnimationFrame(gameLoop);

  if(!race || !document.getElementById('screen-race').classList.contains('active')) {
    return;
  }

  let dt = lastTime ? (time - lastTime) / 1000 : 0;
  dt = Math.max(0, Math.min(0.05, dt));
  lastTime = time;

  const input = getInput();

  if(!paused && race.state !== 'FINISHED') {
    race.update(dt, input, { grip: 1 });

    for(const req of race.particlesRequests) {
      if(req.type === 'smoke') {
        for(let i = 0; i < 3; i++) {
          particles.smoke(req.x + (Math.random() - 0.5) * 10, req.y + (Math.random() - 0.5) * 10);
        }
      } else if(req.type === 'nitro') {
        for(let i = 0; i < 5; i++) {
          particles.flame(req.x, req.y, req.angle);
        }
      } else if(req.type === 'spark') {
        for(let i = 0; i < 8; i++) {
          particles.spark(req.x, req.y);
        }
      }
    }
    particles.update(dt);

    const speedRatio = Math.abs(race.player.body.speed) / race.player.body.physics.maxSpeed;
    audio.updateEngine(speedRatio);
    if(race.player.body.isDrifting && Math.random() < 0.15) audio.drift();
    if(race.player.body.nitroActive && Math.random() < 0.03) audio.nitro();
  }

  if(!paused) {
    const player = race.player;
    const zoom = Math.min(1.2, 0.6 + player.speedKmh / 500);

    ctx.save();
    ctx.fillStyle = '#06060c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(-player.angle - Math.PI / 2);
    ctx.scale(zoom, zoom);
    ctx.translate(-player.x, -player.y);

    drawTrack(ctx, race.track);
    particles.draw(ctx);

    const sorted = [...race.vehicles].sort((a, b) => a.y - b.y);
    for(const v of sorted) v.draw(ctx);

    ctx.restore();

    const pos = race.getPlayerPosition();
    document.getElementById('hud-pos').textContent = pos + 'º';
    document.getElementById('hud-lap').textContent = `VUELTA ${Math.min(race.player.progress.lap + 1, race.laps)}/${race.laps}`;
    document.getElementById('hud-wrongway').classList.toggle('show', race.player.progress.wrongWay);

    const m = Math.floor(race.elapsed / 60);
    const s = Math.floor(race.elapsed % 60);
    const ms = Math.floor((race.elapsed % 1) * 100);
    document.getElementById('hud-time').textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;

    document.getElementById('hud-speed').textContent = Math.round(race.player.speedKmh);
    document.getElementById('hud-nitro').style.width = race.player.body.nitroFuel + '%';
    document.getElementById('hud-damage').style.width = race.player.body.damage + '%';

    // Minimapa: usa la escala/offset precalculados en buildTrack en
    // lugar de recorrer todos los puntos de la pista cada frame.
    const mc = document.getElementById('minimap');
    const mctx = mc.getContext('2d');
    const track = race.track;
    const { mapScale: scale, mapOffX: offX, mapOffY: offY } = track;

    mctx.clearRect(0, 0, 150, 150);
    mctx.save();
    mctx.strokeStyle = 'rgba(46,242,255,0.7)';
    mctx.lineWidth = 2.5;
    mctx.beginPath();
    track.points.forEach((p, i) => {
      const x = p.x * scale + offX;
      const y = p.y * scale + offY;
      i === 0 ? mctx.moveTo(x, y) : mctx.lineTo(x, y);
    });
    mctx.closePath();
    mctx.stroke();

    for(const v of race.vehicles) {
      mctx.fillStyle = v.isPlayer ? '#ffe62e' : '#ff2e88';
      const x = v.x * scale + offX;
      const y = v.y * scale + offY;
      mctx.beginPath();
      mctx.arc(x, y, v.isPlayer ? 5 : 3.5, 0, Math.PI * 2);
      mctx.fill();
    }
    mctx.restore();
  }

  if(race.state === 'FINISHED' && !ended) {
    showResults();
  }
}

// ---------- INICIO ----------
(async function init(){
  SAVE = await loadSave();
  audio.setEnabled(SAVE.sound);
  applyTouchControls();
  showScreen('screen-main');
  animId = requestAnimationFrame(gameLoop);

  console.log('🎮 NEON RUSH - STREET LEGENDS (v3.0, reconstruido)');
  console.log('🏁 Corredores:');
  TUS_CORREDORES.forEach((nombre, i) => console.log(`  ${i+1}. ${nombre}`));
  console.log(hasStorage ? '💾 Guardado persistente activo.' : '⚠️ Sin window.storage: los récords no persistirán entre sesiones.');
})();
</script>
